# Nightly build → single rolling 'nightly' pre-release.
#
# MANUAL only: Actions → nightly → "Run workflow" (or `gh workflow run nightly.yml`),
# fired when enough has changed since the last build. No cron: GitHub disables
# scheduled workflows after 60 days without repo activity, and an unchanged tree
# rebuilt every night is noise.
#
# Cross-compiles the shippable deliverables with mingw via the lean `.#ci` Nix
# shell (NO game assets needed — the port/patch/tools read the user's own files
# at runtime), gates on the no-embedded-assets scan, then clobbers ONE long-lived
# pre-release tagged `nightly`.
#
# Deliverables:
#   opensummoners-standalone.exe — the port (plays the game with no retail code)
#   res_explorer.exe             — the SotES resource explorer
#   version.dll + ennse-voice-patch.zip — the EN-SE Japanese-voice patch (+ installer)
#
# Why one rolling release: GitHub notifies watchers when a *new* release is
# published, but NOT when an existing release's assets are updated. So we keep
# `nightly` stable and clobber its assets each run — watchers are pinged at
# most once. It's prerelease + make_latest:false so it never becomes "latest".
# Milestone tags (vX.Y) are cut separately (see release.yml) and DO notify.

name: nightly

on:
  workflow_dispatch: {}         # manual "Run workflow" button

permissions:
  contents: write               # create/update the 'nightly' release + tag

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history + tags: the changes since the previous nightly

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build — standalone port (opensummoners-standalone.exe)
        run: nix develop .#ci --command bash tools/rhost/build.sh

      - name: Build — resource explorer (res_explorer.exe)
        run: nix develop .#ci --command make -C tools/res_explorer

      - name: Build — EN-SE voice patch (version.dll)
        run: nix develop .#ci --command make -C tools/ennse_voice

      - name: Gate — no embedded game assets
        run: nix develop .#ci --command python3 tools/ci/no_proprietary_bytes.py
             build/rhost/opensummoners-standalone.exe build/res_explorer.exe build/version.dll

      - name: Package — voice patch zip
        run: nix develop .#ci --command bash tools/ci/package_patch.sh

      # 'nightly' still points at the previous build here (repointed below), so the notes
      # list exactly what this build adds
      - name: Compose release notes
        run: |
          prev=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)
          {
            echo "Automated nightly build — unsigned, **bring your own game**."
            echo
            echo "Source commit: \`${GITHUB_SHA}\`"
            echo "Built: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "Ships **no game assets**. Everything reads your own"
            echo "legitimately-owned files at runtime:"
            echo "- **opensummoners-standalone.exe** — the port: plays the English 2012 Steam"
            echo "  release with none of the original's code, only the data in your own files."
            echo "  Copy it into the game folder (beside \`sotes.exe\`, the \`sotes*.dll\` files and"
            echo "  \`lizsoft.spl\`) and run it. The stock Steam \`sotes.exe\` works as is."
            echo "- **res_explorer.exe** — resource explorer: view + export every sprite"
            echo "  sheet, map, SFX/voice clip and BGM stream in your own game files."
            echo "- **ennse-voice-patch.zip** — adds Japanese voice to the English special"
            echo "  edition; run Install.bat (needs \`sotesx_s.dll\` from your own JP copy)."
            echo
            if [ -n "$prev" ] && git merge-base --is-ancestor "$prev" HEAD; then
              n=$(git rev-list --count "$prev..HEAD")
              echo "### Changes since the previous nightly (\`${prev:0:7}\` → \`${GITHUB_SHA:0:7}\`, $n commits)"
              echo "[Full diff](https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_SHA})"
              echo
              if [ "$n" -eq 0 ]; then echo "- (none: a rebuild of the same commit)"; fi
              git log -60 --pretty='- %s (%h)' "$prev..HEAD"
              if [ "$n" -gt 60 ]; then echo "- … and $((n - 60)) more"; fi
            else
              echo "### Recent changes"
              git log -15 --pretty='- %s (%h)'
            fi
          } > release-notes.md

      # Repoint 'nightly' onto the built commit so the release links to fresh
      # source (softprops attaches to an existing tag but never repoints it).
      - name: Repoint 'nightly' tag to the built commit
        run: |
          git tag -f nightly "${GITHUB_SHA}"
          git push -f origin "refs/tags/nightly"

      # Publish via the pre-installed GitHub CLI (no third-party action → no
      # Node-runtime churn / undici "other side closed" flakiness), with a small
      # retry on transient API errors. Idempotent: create the release the first
      # time, edit it thereafter, then clobber its assets and drop any asset a
      # build no longer ships (e.g. the retired opensummoners.exe front end).
      - name: Publish to rolling 'nightly' pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry() { local n; for n in 1 2 3; do "$@" && return 0; echo "  (attempt $n failed — retry in 10s)"; sleep 10; done; return 1; }
          files="build/rhost/opensummoners-standalone.exe build/res_explorer.exe build/version.dll build/ennse-voice-patch.zip"
          if gh release view nightly >/dev/null 2>&1; then
            retry gh release edit nightly --prerelease --latest=false \
              --title Nightly --notes-file release-notes.md --target "$GITHUB_SHA"
          else
            retry gh release create nightly --prerelease --latest=false \
              --title Nightly --notes-file release-notes.md --target "$GITHUB_SHA"
          fi
          retry gh release upload nightly --clobber $files
          keep=" $(for f in $files; do printf '%s ' "$(basename "$f")"; done)"
          for a in $(gh release view nightly --json assets -q '.assets[].name'); do
            case "$keep" in *" $a "*) ;; *) echo "removing stale asset $a"; retry gh release delete-asset nightly "$a" -y ;; esac
          done
